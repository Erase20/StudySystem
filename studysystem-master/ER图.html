<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ER图 - 在线学习管理系统</title>
<style>
  body { margin: 0; padding: 30px; background: #fff; font-family: SimHei, "Microsoft YaHei", sans-serif; }
  h1 { text-align: center; font-size: 20px; color: #222; margin-bottom: 24px; }
  svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
  .note { text-align: center; font-size: 12px; color: #888; margin-top: 14px; }
</style>
</head>
<body>
<h1>系统 E-R 关系图</h1>
<svg viewBox="-12 -5 970 395" width="1100" xmlns="http://www.w3.org/2000/svg"
     style="font-family:'Microsoft YaHei','SimHei',sans-serif;">

  <!-- ===== 实体→关系连线 ===== -->
  <g stroke="#000" stroke-width="1.3" fill="none">
    <line x1="195" y1="190" x2="288" y2="190"/>
    <line x1="362" y1="190" x2="465" y2="190"/>
    <line x1="565" y1="190" x2="658" y2="190"/>
    <line x1="732" y1="190" x2="810" y2="190"/>
    <!-- 用户→签到（垂直向下，不与其他线交叉） -->
    <line x1="145" y1="215" x2="145" y2="295"/>
  </g>

  <!-- ===== 基数标注 ===== -->
  <g font-size="11" fill="#555" font-style="italic">
    <text x="225" y="183">1</text>  <text x="340" y="183">N</text>
    <text x="590" y="183">1</text>  <text x="710" y="183">N</text>
    <text x="155" y="258">1</text>  <text x="155" y="288">N</text>
  </g>

  <!-- ===== 属性→实体/关系连线 ===== -->
  <g stroke="#000" stroke-width="0.8" fill="none">
    <!-- 用户属性 -->
    <line x1="80"  y1="118" x2="118" y2="168"/>
    <line x1="225" y1="118" x2="175" y2="168"/>
    <line x1="62"  y1="255" x2="115" y2="212"/>
    <!-- 购买属性 -->
    <line x1="260" y1="143" x2="300" y2="172"/>
    <line x1="390" y1="143" x2="350" y2="172"/>
    <!-- 课程属性 -->
    <line x1="445" y1="118" x2="490" y2="168"/>
    <line x1="600" y1="118" x2="545" y2="168"/>
    <line x1="445" y1="260" x2="490" y2="212"/>
    <!-- 兑换属性 -->
    <line x1="630" y1="143" x2="668" y2="172"/>
    <line x1="758" y1="143" x2="722" y2="172"/>
    <!-- 积分商品属性 -->
    <line x1="790" y1="118" x2="835" y2="168"/>
    <line x1="900" y1="118" x2="865" y2="168"/>
    <line x1="905" y1="255" x2="870" y2="212"/>
    <!-- 签到属性 -->
    <line x1="48"  y1="352" x2="118" y2="332"/>
    <line x1="248" y1="352" x2="172" y2="332"/>
  </g>

  <!-- ===== 属性椭圆 ===== -->
  <g fill="#fff" stroke="#000" stroke-width="1">
    <!-- 用户 -->
    <ellipse cx="55"  cy="108" rx="40" ry="16"/>
    <ellipse cx="250" cy="108" rx="38" ry="16"/>
    <ellipse cx="40"  cy="258" rx="38" ry="16"/>
    <!-- 购买 -->
    <ellipse cx="238" cy="135" rx="38" ry="14"/>
    <ellipse cx="408" cy="135" rx="38" ry="14"/>
    <!-- 课程 -->
    <ellipse cx="425" cy="108" rx="38" ry="16"/>
    <ellipse cx="618" cy="108" rx="38" ry="16"/>
    <ellipse cx="425" cy="265" rx="38" ry="16"/>
    <!-- 兑换 -->
    <ellipse cx="612" cy="135" rx="38" ry="14"/>
    <ellipse cx="775" cy="135" rx="38" ry="14"/>
    <!-- 积分商品 -->
    <ellipse cx="775" cy="108" rx="38" ry="16"/>
    <ellipse cx="905" cy="108" rx="42" ry="16"/>
    <ellipse cx="905" cy="258" rx="42" ry="16"/>
    <!-- 签到 -->
    <ellipse cx="30"  cy="358" rx="38" ry="16"/>
    <ellipse cx="265" cy="358" rx="38" ry="16"/>
  </g>

  <!-- ===== 属性文字 ===== -->
  <g font-size="12" fill="#222" text-anchor="middle">
    <!-- 用户 -->
    <text x="55"  y="113"><tspan text-decoration="underline">编号</tspan></text>
    <text x="250" y="113">账号</text>
    <text x="40"  y="263">积分</text>
    <!-- 购买 -->
    <text x="238" y="140"><tspan text-decoration="underline">编号</tspan></text>
    <text x="408" y="140">金额</text>
    <!-- 课程 -->
    <text x="425" y="113"><tspan text-decoration="underline">编号</tspan></text>
    <text x="618" y="113">名称</text>
    <text x="425" y="270">类型</text>
    <!-- 兑换 -->
    <text x="612" y="140"><tspan text-decoration="underline">编号</tspan></text>
    <text x="775" y="140">消耗积分</text>
    <!-- 积分商品 -->
    <text x="775" y="113"><tspan text-decoration="underline">编号</tspan></text>
    <text x="905" y="113">名称</text>
    <text x="905" y="263">所需积分</text>
    <!-- 签到 -->
    <text x="30"  y="363"><tspan text-decoration="underline">编号</tspan></text>
    <text x="265" y="363">日期</text>
  </g>

  <!-- ===== 关系菱形 ===== -->
  <g>
    <polygon points="325,168 362,190 325,212 288,190" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="325" y="195" text-anchor="middle" font-size="13" fill="#222">购买</text>

    <polygon points="695,168 732,190 695,212 658,190" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="695" y="195" text-anchor="middle" font-size="13" fill="#222">兑换</text>

    <polygon points="145,295 182,317 145,339 108,317" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="145" y="322" text-anchor="middle" font-size="13" fill="#222">签到</text>
  </g>

  <!-- ===== 实体矩形（最上层） ===== -->
  <g>
    <rect x="100" y="168" width="95" height="44" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="148" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#222">用户</text>

    <rect x="465" y="168" width="100" height="44" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="515" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#222">课程</text>

    <rect x="810" y="168" width="100" height="44" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="860" y="196" text-anchor="middle" font-size="15" font-weight="700" fill="#222">积分商品</text>
  </g>

</svg>
<p class="note">注：矩形为实体，菱形为关系，椭圆为属性，带下划线字段为主键，斜体数字为关系基数</p>
</body>
</html>
