<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>在线学习管理系统 - 泳道图</title>
<style>
  body { margin: 0; padding: 20px; background: #fff; display: flex; justify-content: center; }
  svg { max-width: 100%; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" style="font-family:'Microsoft YaHei','SimSun',sans-serif;">

<!-- 箭头标记 -->
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
    <path d="M0,0 L8,3 L0,6 Z" fill="#000"/>
  </marker>
</defs>

<!-- ==================== 表头 ==================== -->
<rect x="0" y="0" width="1200" height="44" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="80" y="28" fill="#000" font-size="14" font-weight="700" text-anchor="middle">角色</text>
<line x1="160" y1="0" x2="160" y2="44" stroke="#000" stroke-width="1"/>
<text x="335" y="28" fill="#000" font-size="14" font-weight="700" text-anchor="middle">浏览发现</text>
<line x1="510" y1="0" x2="510" y2="44" stroke="#000" stroke-width="1"/>
<text x="685" y="28" fill="#000" font-size="14" font-weight="700" text-anchor="middle">交易兑换</text>
<line x1="860" y1="0" x2="860" y2="44" stroke="#000" stroke-width="1"/>
<text x="1035" y="28" fill="#000" font-size="14" font-weight="700" text-anchor="middle">内容互动</text>

<!-- ==================== 列分割线 ==================== -->
<line x1="160" y1="44" x2="160" y2="920" stroke="#000" stroke-width="1"/>
<line x1="510" y1="44" x2="510" y2="920" stroke="#000" stroke-width="1"/>
<line x1="860" y1="44" x2="860" y2="920" stroke="#000" stroke-width="1"/>

<!-- ==================== 学员泳道 ==================== -->
<text x="80" y="150" fill="#000" font-size="16" font-weight="700" text-anchor="middle">学员</text>

<!-- 浏览发现列 -->
<rect x="185" y="64" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="85" font-size="12" text-anchor="middle">浏览课程列表</text>
<line x1="250" y1="96" x2="250" y2="112" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="185" y="112" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="133" font-size="12" text-anchor="middle">查看课程详情</text>
<line x1="250" y1="144" x2="250" y2="160" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="185" y="160" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="181" font-size="12" text-anchor="middle">浏览资料列表</text>
<line x1="315" y1="176" x2="530" y2="176" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 交易兑换列 -->
<rect x="535" y="64" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="85" font-size="12" text-anchor="middle">购买会员/课程</text>
<line x1="665" y1="80" x2="880" y2="80" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<polygon points="600,112 640,132 600,152 560,132" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="136" font-size="11" text-anchor="middle">是否会员?</text>
<line x1="600" y1="152" x2="600" y2="172" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="610" y="168" font-size="10">否</text>
<rect x="535" y="172" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="193" font-size="12" text-anchor="middle">积分兑换资料</text>
<line x1="665" y1="188" x2="880" y2="188" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="608" y="108" font-size="10">是</text>

<!-- 内容互动列 -->
<rect x="885" y="64" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="85" font-size="12" text-anchor="middle">播放课程视频</text>
<rect x="885" y="112" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="133" font-size="12" text-anchor="middle">下载资料文件</text>
<rect x="885" y="160" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="181" font-size="12" text-anchor="middle">课程评论/回复</text>

<!-- ==================== 水平虚线分隔 ==================== -->
<line x1="0" y1="264" x2="1200" y2="264" stroke="#000" stroke-width="1" stroke-dasharray="8,4"/>

<!-- ==================== 上传者泳道 ==================== -->
<text x="80" y="380" fill="#000" font-size="16" font-weight="700" text-anchor="middle">上传者</text>

<!-- 浏览发现列 -->
<rect x="185" y="284" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="305" font-size="12" text-anchor="middle">进入"我的资料"</text>
<line x1="250" y1="316" x2="250" y2="332" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="185" y="332" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="353" font-size="12" text-anchor="middle">点击上传资料</text>
<line x1="315" y1="348" x2="530" y2="348" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 交易兑换列 -->
<rect x="535" y="284" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="305" font-size="12" text-anchor="middle">选择本机文件</text>
<line x1="600" y1="316" x2="600" y2="332" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="535" y="332" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="353" font-size="12" text-anchor="middle">填写资料信息</text>
<line x1="600" y1="364" x2="600" y2="380" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="535" y="380" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="401" font-size="12" text-anchor="middle">提交审核</text>
<line x1="665" y1="396" x2="880" y2="396" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>

<!-- 内容互动列 -->
<rect x="885" y="284" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="305" font-size="12" text-anchor="middle">等待审核结果</text>
<polygon points="950,332 990,352 950,372 910,352" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="356" font-size="11" text-anchor="middle">通过?</text>
<line x1="950" y1="372" x2="950" y2="392" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="958" y="388" font-size="10">否</text>
<rect x="885" y="392" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="413" font-size="12" text-anchor="middle">修改重新提交</text>
<text x="958" y="328" font-size="10">是</text>

<!-- ==================== 水平虚线分隔 ==================== -->
<line x1="0" y1="504" x2="1200" y2="504" stroke="#000" stroke-width="1" stroke-dasharray="8,4"/>

<!-- ==================== 管理员泳道 ==================== -->
<text x="80" y="610" fill="#000" font-size="16" font-weight="700" text-anchor="middle">管理员</text>

<!-- 浏览发现列 -->
<rect x="185" y="524" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="545" font-size="12" text-anchor="middle">发布课程</text>
<line x1="250" y1="556" x2="250" y2="572" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="185" y="572" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="593" font-size="12" text-anchor="middle">管理章节目录</text>
<line x1="250" y1="604" x2="250" y2="620" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="185" y="620" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="641" font-size="12" text-anchor="middle">上传课程视频</text>

<!-- 交易兑换列 -->
<rect x="535" y="524" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="545" font-size="12" text-anchor="middle">审核用户资料</text>
<line x1="600" y1="556" x2="600" y2="572" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<polygon points="600,572 640,592 600,612 560,592" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="596" font-size="11" text-anchor="middle">审核决策</text>
<line x1="600" y1="612" x2="600" y2="632" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<text x="608" y="628" font-size="10">是</text>
<rect x="535" y="632" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="653" font-size="12" text-anchor="middle">设置推荐状态</text>

<!-- 内容互动列 -->
<rect x="885" y="524" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="545" font-size="12" text-anchor="middle">管理用户/管理员</text>
<rect x="885" y="572" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="593" font-size="12" text-anchor="middle">发布公告通知</text>
<rect x="885" y="620" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="641" font-size="12" text-anchor="middle">管理积分商品</text>

<!-- ==================== 水平虚线分隔 ==================== -->
<line x1="0" y1="724" x2="1200" y2="724" stroke="#000" stroke-width="1" stroke-dasharray="8,4"/>

<!-- ==================== 系统自动泳道 ==================== -->
<text x="80" y="826" fill="#000" font-size="16" font-weight="700" text-anchor="middle">系统自动</text>

<!-- 浏览发现列 -->
<rect x="185" y="744" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>

<line x1="250" y1="776" x2="250" y2="792" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="185" y="792" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="250" y="813" font-size="12" text-anchor="middle">热门课程排行</text>

<!-- 交易兑换列 -->
<rect x="535" y="744" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="765" font-size="12" text-anchor="middle">自动开通课程</text>
<line x1="600" y1="776" x2="600" y2="792" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="535" y="792" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="813" font-size="12" text-anchor="middle">扣除兑换积分</text>
<line x1="600" y1="824" x2="600" y2="840" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="535" y="840" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="600" y="861" font-size="12" text-anchor="middle">上传者获50%积分</text>

<!-- 内容互动列 -->
<rect x="885" y="744" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="765" font-size="12" text-anchor="middle">签到自动记录</text>
<line x1="950" y1="776" x2="950" y2="792" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="885" y="792" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="813" font-size="12" text-anchor="middle">学习进度追踪</text>
<line x1="950" y1="824" x2="950" y2="840" stroke="#000" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="885" y="840" width="130" height="32" rx="4" fill="#fff" stroke="#000" stroke-width="1.5"/>
<text x="950" y="861" font-size="12" text-anchor="middle">隐藏未兑换链接</text>

<!-- ==================== 跨泳道交互虚线 ==================== -->
<line x1="600" y1="204" x2="600" y2="284" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="600" y1="424" x2="600" y2="524" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>
<line x1="600" y1="672" x2="600" y2="744" stroke="#000" stroke-width="1" stroke-dasharray="4,3"/>

<!-- 外框 -->
<rect x="0" y="0" width="1200" height="920" fill="none" stroke="#000" stroke-width="2"/>

</svg>
</body>
</html>
